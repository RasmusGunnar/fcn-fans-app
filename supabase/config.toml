# Supabase project configuration
# https://supabase.com/docs/guides/functions/auth#disabling-default-jwt-verification

# sync_fcn_fixtures: uses x-sync-secret header instead of JWT.
# This disables the gateway-level JWT check so cron jobs can call it
# with only the x-sync-secret header.
[functions.sync_fcn_fixtures]
verify_jwt = false

# sync_superliga_standings: internal standings sync via x-sync-secret.
[functions.sync_superliga_standings]
verify_jwt = false

# sync_wild_tigers_songs: internal song import/sync via x-sync-secret.
[functions.sync_wild_tigers_songs]
verify_jwt = false

# sync-fixtures: app admin on-demand sync. Requires user JWT and in-function admin check.
[functions.sync-fixtures]
verify_jwt = true

# sportsdb_team_hero: public, no JWT needed (returns hero image URL for a team).
[functions.sportsdb_team_hero]
verify_jwt = false

# parse-link: public preview fetcher for external URLs in "Del nyhed".
[functions.parse-link]
verify_jwt = false

# discussion-link-preview: authenticated server-side preview fetcher with SSRF guards and DB cache.
[functions.discussion-link-preview]
verify_jwt = true

# Manual app-admin ingestion into the private media article review queue.
[functions.ingest-media-article-candidates]
verify_jwt = true

# weekly_top_fan: cron-driven editorial feed card generation via x-sync-secret.
[functions.weekly_top_fan]
verify_jwt = false

# weekly_ranking: authenticated self-only ranking lookup via JWT auth context.
[functions.weekly_ranking]
verify_jwt = true

# sync_fan_levels: daily batch fan status writer via x-sync-secret.
[functions.sync_fan_levels]
verify_jwt = false

# Push notification jobs: cron-driven via x-sync-secret.
[functions.push_match_reminders]
verify_jwt = false

[functions.push_event_reminders]
verify_jwt = false

[functions.push_hot_posts]
verify_jwt = false

# send-push: authenticated self-test route used from the app profile screen.
# Keep JWT verification ON and let the function enforce self-targeting.
[functions.send-push]
verify_jwt = true

# claim_push_token: authenticated server-side token claim to avoid client RLS conflicts.
[functions.claim_push_token]
verify_jwt = true

# push_comment_replies: authenticated route triggered after a successful comment insert.
[functions.push_comment_replies]
verify_jwt = true

# push_community_posts: authenticated route triggered after a successful community post/poll insert.
[functions.push_community_posts]
verify_jwt = true

# push_mentions: authenticated route triggered after successful post/comment/reply writes.
[functions.push_mentions]
verify_jwt = true

# delete_my_account: authenticated self-service account deletion from the profile screen.
[functions.delete_my_account]
verify_jwt = true
