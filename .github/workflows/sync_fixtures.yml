name: Sync FCN fixtures

on:
  schedule:
    - cron: "5 6,18 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_SYNC_URL }}" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            -H "content-type: application/json" \
            --data "{}"
